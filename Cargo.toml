[workspace]
resolver = "2"
members = ["examples/*", "features/*", "strategies/*", "wrapp"]
exclude = ["examples/prototype"]

package.license = "MIT OR Apache-2.0"
package.edition = "2024"
package.version = "0.0.0"

[workspace.dependencies]

# Project Modules
wrapp-di = { version = "0.0.0", path = "./features/wrapp-di" }

# External Crates
futures = "0.3"
futures-channel = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3.23"
pin-project-lite = "0.2"
thiserror = "2.0"


[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = { level = "warn" }

option_if_let_else = { level = "allow" }     # More readable
items_after_statements = { level = "allow" } # More readable
match_bool = { level = "allow" }             # Personal preference
