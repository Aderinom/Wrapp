[workspace]
resolver = "2"
members = ["examples/*", "features/*", "strategies/*", "wrapp"]
exclude = ["examples/prototype"]

package.edition = "2024"
package.version = "0.0.0"

[workspace.dependencies]

# Project Modules
wrapp-di = { path = "./features/wrapp-di" }

# External Crates
futures = "0.3"
futures-channel = "0.3"
tracing = "0.1"
pin-project-lite = "0.2"
thiserror = "2.0"


[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

option_if_let_else = { level = "allow" }     # More readable
items_after_statements = { level = "allow" } # More readable
match_bool = { level = "allow" }             # Personal preference
